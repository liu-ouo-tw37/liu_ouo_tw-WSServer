<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Server Console</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="logo">MC</span><strong>Minecraft</strong><span class="subtitle">Server Console</span></div><span id="connection" role="status">連線中</span></header>
<main><form id="login" hidden><label for="code">伺服器查看碼</label><input id="code" autocomplete="off" maxlength="16" required><button type="submit">連線</button><span id="loginError" role="status"></span></form><div class="heading"><h1 id="owner">伺服器監控</h1><span id="updated">等待資料</span></div>
<section class="metrics" aria-label="即時指標"><article><span>在線玩家</span><strong id="online">—</strong></article><article><span>CPU</span><strong id="cpu">—</strong><meter id="cpuMeter" min="0" max="100" value="0"></meter></article><article><span>WebSocket RTT</span><strong id="latency">—</strong></article><article><span>世界指令 / min</span><strong id="commands">—</strong></article><article><span>AI 請求 · 本次啟動</span><strong id="ai">—</strong></article></section>
<div class="workspace"><aside><section><h2>在線玩家</h2><ul id="players"></ul><p id="playerEmpty">目前沒有在線玩家</p></section><section class="music"><h2>目前歌曲</h2><strong id="song">尚未播放</strong><progress id="progress" max="1" value="0"></progress><span id="songTime">—</span></section></aside>
<div class="streams"><section><div class="sectionHead"><h2>即時聊天</h2><label><input type="checkbox" id="follow" checked> 跟隨新訊息</label></div><div id="chat" class="feed" role="log"></div></section><section><div class="sectionHead"><h2>事件 Log</h2><input type="search" id="filter" placeholder="篩選事件" aria-label="篩選事件"></div><div id="logs" class="feed" role="log"></div></section></div></div></main><footer>LOCAL CONSOLE <span id="world">等待 Minecraft 連線</span></footer></body></html>
